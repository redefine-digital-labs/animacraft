name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check production build
        run: npm run check

      - name: Verify bundled Creator Packs
        run: npm run makers:verify

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify required files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f GOVERNANCE.md
          test -f CONTRIBUTING.md
          test -f index.html
          test -f app.js
          test -f draft-store.js
          test -f living-content.js
          test -f manifest-validation.js
          test -f recipe-hash.js
          test -f remote-read.js
          test -f runtime-config.js
          test -f scripts/mainnet-preflight.mjs
          test -f scripts/build-builtin-makers.py
          test -f scripts/chroma_key.py
          test -f test/bundled-makers.test.js
          test -f test/manifest-validation.test.js
          test -f test/living-content.test.js
          test -f test/recipe-hash.test.js
          test -f test/remote-read.test.js
          test -f test/runtime-config.test.js
          test -f styles.css
          test -f move/animacraft/Move.toml
          test -f move/animacraft/sources/animacraft.move
          test -f move/animacraft_physical_v7/Move.toml
          test -f move/animacraft_physical_v7/sources/physical_composition_v7.move

      - name: Prevent generated build artifacts
        run: |
          if git ls-files | grep -E '(^|/)build/'; then
            echo "Generated build artifacts must not be committed."
            exit 1
          fi

      - name: Check for obvious secret names
        run: |
          if git grep -nE '(PRIVATE_KEY|SECRET_KEY|ACCESS_TOKEN|GITHUB_TOKEN|MNEMONIC=)' -- . ':!.github/workflows/repository-hygiene.yml'; then
            echo "Potential secret-like text found. Please remove or document why it is safe."
            exit 1
          fi
