name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      soulidity_commit_sha:
        description: Exact reviewed Soulidity commit for this paired release check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOULIDITY_COMMIT_SHA: ${{ inputs.soulidity_commit_sha || vars.SOULIDITY_COMMIT_SHA }}
      SOULIDITY_WORKSPACE: ${{ github.workspace }}/_paired/soulidity

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Require exact paired source revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOULIDITY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SOULIDITY_COMMIT_SHA must identify the reviewed paired commit; branch fallback is forbidden.'
            exit 1
          fi

      - name: Checkout paired Soulidity source
        uses: actions/checkout@v6
        with:
          repository: redefine-digital-labs/soulidity
          ref: ${{ env.SOULIDITY_COMMIT_SHA }}
          path: _paired/soulidity
          persist-credentials: false

      - name: Verify paired source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _paired/soulidity rev-parse HEAD)" = "$SOULIDITY_COMMIT_SHA"
          test -f "$SOULIDITY_WORKSPACE/move/soulidity/sources/market.move"

      - name: Check production build
        run: npm run check

  move:
    name: Paired eight-package Move gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOULIDITY_COMMIT_SHA: ${{ inputs.soulidity_commit_sha || vars.SOULIDITY_COMMIT_SHA }}
      # Official Ubuntu x86_64 archive digest, not the macOS executable hash.
      # Framework dependencies remain separately pinned in Move.toml.
      SUI_RELEASE: mainnet-v1.80.1
      SUI_ARCHIVE: sui-mainnet-v1.80.1-ubuntu-x86_64.tgz
      SUI_ARCHIVE_SHA256: 97f9aed10e0c2fe3204ce4639ac992e1449b17c14f22f30e9f903ead54ac7336

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require exact paired source revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOULIDITY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SOULIDITY_COMMIT_SHA must identify the reviewed paired commit; branch fallback is forbidden.'
            exit 1
          fi

      - name: Checkout paired Soulidity source
        uses: actions/checkout@v6
        with:
          repository: redefine-digital-labs/soulidity
          ref: ${{ env.SOULIDITY_COMMIT_SHA }}
          path: _paired/soulidity
          persist-credentials: false

      - name: Verify paired source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _paired/soulidity rev-parse HEAD)" = "$SOULIDITY_COMMIT_SHA"
          test -f _paired/soulidity/move/soulidity/Move.toml
          node --test test/harness/native-soul-v8/*.test.mjs test/seal-cap-toolchain-identity.test.mjs

      - name: Install pinned Sui CLI
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/sui-bin"
          binary="$bin_dir/sui"
          archive="$RUNNER_TEMP/$SUI_ARCHIVE"
          mkdir -p "$bin_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_RELEASE}/${SUI_ARCHIVE}" \
            --output "$archive"
          echo "${SUI_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          member="$(tar -tzf "$archive" | grep -E '^(\./)?sui$')"
          test "$(printf '%s\n' "$member" | wc -l)" -eq 1
          tar -xOzf "$archive" "$member" > "$binary"
          chmod 0755 "$binary"
          echo "$bin_dir" >> "$GITHUB_PATH"
          test "$("$binary" --version)" = 'sui 1.80.1-671ba71e69c7'

      - name: Verify test-only seal-cap reproducibility
        shell: bash
        run: |
          set -euo pipefail
          ANIMACRAFT_SUI_BINARY="$RUNNER_TEMP/sui-bin/sui" \
            ANIMACRAFT_SUI_ARCHIVE="$RUNNER_TEMP/$SUI_ARCHIVE" \
            npm run move:seal-cap:quick 2>&1 | tee "$RUNNER_TEMP/seal-cap-quick.log"
          # The certificate uses original addresses; the following graph rewrites
          # addresses only. No checked-out source may change between those gates.
          git diff --exit-code HEAD -- move scripts test/harness

      - name: Run paired eight-package Move and joint gates
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node scripts/native-soul-test-graph.mjs \
            --animacraft-root "$GITHUB_WORKSPACE" \
            --soulidity-root "$GITHUB_WORKSPACE/_paired/soulidity" \
            --sui "$RUNNER_TEMP/sui-bin/sui" --check release-gates

      - name: Bundle paired Move gate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          shopt -s nullglob
          files=(native-soul-v8-graph-*/*.json native-soul-v8-graph-*/*.log)
          if [[ -f seal-cap-quick.log ]]; then files+=(seal-cap-quick.log); fi
          if (( ${#files[@]} == 0 )); then exit 0; fi
          tar -czf paired-move-evidence.tgz -- "${files[@]}"

      - name: Retain paired Move gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-move-gates-${{ github.run_id }}
          path: ${{ runner.temp }}/paired-move-evidence.tgz
          if-no-files-found: warn
          retention-days: 30

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify required files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f GOVERNANCE.md
          test -f CONTRIBUTING.md
          test -f index.html
          test -f app.js
          test -f maker-v8-runtime.js
          test -f maker-v8-compiler.js
          test -f maker-v8-market.js
          test -f maker-v8-recovery.js
          test -f maker-v8-browser.js
          test -f test/maker-v8-runtime.test.js
          test -f test/maker-v8-compiler.test.js
          test -f test/maker-v8-market.test.js
          test -f test/maker-v8-recovery.test.js
          test -f test/maker-v8-browser.test.js
          test -f styles.css
          for package in core seal runtime output physical market release; do
            test -f "move/animacraft_v8_${package}/Move.toml"
          done
          test -f test/harness/animacraft_v8_seal_cap_harness/Move.toml
          test -f test/harness/animacraft_v8_seal_cap_harness/README.md
          test -f test/harness/animacraft_v8_seal_cap_harness/fixture/slim-core/Move.toml
          test -f test/harness/animacraft_v8_seal_cap_harness/fixture/slim-core/sources/base_registry_v8.move
          test -f test/harness/animacraft_v8_seal_cap_harness/evidence/manifest.json
          test -f test/harness/animacraft_v8_seal_cap_harness/scripts/run_localnet_replay.mjs

      - name: Verify fresh-only delivery surface
        run: npm run scan:fresh:source

      - name: Prevent generated build artifacts
        run: |
          if git ls-files | grep -E '(^|/)build/'; then
            echo "Generated build artifacts must not be committed."
            exit 1
          fi

      - name: Check for obvious secret names
        run: |
          if git grep -nE '(PRIVATE_KEY|SECRET_KEY|ACCESS_TOKEN|GITHUB_TOKEN|MNEMONIC=)' -- . ':!.github/workflows/repository-hygiene.yml'; then
            echo "Potential secret-like text found. Please remove or document why it is safe."
            exit 1
          fi
