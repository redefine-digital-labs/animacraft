name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check production build
        run: npm run check

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify required files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f GOVERNANCE.md
          test -f CONTRIBUTING.md
          test -f index.html
          test -f app.js
          test -f maker-v8-runtime.js
          test -f maker-v8-compiler.js
          test -f maker-v8-market.js
          test -f maker-v8-recovery.js
          test -f maker-v8-browser.js
          test -f test/maker-v8-runtime.test.js
          test -f test/maker-v8-compiler.test.js
          test -f test/maker-v8-market.test.js
          test -f test/maker-v8-recovery.test.js
          test -f test/maker-v8-browser.test.js
          test -f styles.css
          for package in core seal runtime output physical market release; do
            test -f "move/animacraft_v8_${package}/Move.toml"
          done

      - name: Verify fresh-only delivery surface
        run: npm run scan:fresh:source

      - name: Prevent generated build artifacts
        run: |
          if git ls-files | grep -E '(^|/)build/'; then
            echo "Generated build artifacts must not be committed."
            exit 1
          fi

      - name: Check for obvious secret names
        run: |
          if git grep -nE '(PRIVATE_KEY|SECRET_KEY|ACCESS_TOKEN|GITHUB_TOKEN|MNEMONIC=)' -- . ':!.github/workflows/repository-hygiene.yml'; then
            echo "Potential secret-like text found. Please remove or document why it is safe."
            exit 1
          fi
