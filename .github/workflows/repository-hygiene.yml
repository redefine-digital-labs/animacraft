name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check production build
        run: npm run check

  move:
    name: Seven-package Move gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUI_COMMIT: 82ac538148cc951d35b97d98062d1573f1b98f05
      SUI_BINARY_SHA256: cfb006b9775f69d891fde8f6506af7aabb4a2643087d26b10bdbbe904e26d657

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned Sui CLI
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/sui-bin"
          binary="$bin_dir/sui"
          mkdir -p "$bin_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://releases.sui.io/${SUI_COMMIT}/sui" \
            --output "$binary"
          echo "${SUI_BINARY_SHA256}  ${binary}" | sha256sum --check --strict
          chmod 0755 "$binary"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$binary" --version | grep --fixed-strings 'sui 1.76.1'

      - name: Build all seven packages
        run: npm run move:build

      - name: Test all seven packages
        run: npm run move:test

      - name: Verify test-only seal-cap evidence harness
        run: npm run move:seal-cap:harness

      - name: Run adversarial compile probes
        run: npm run move:probes

      - name: Force disassembly and enforce package sizes
        shell: bash
        run: |
          set -euo pipefail
          for package in core seal runtime output physical market release; do
            sui move build \
              --path "move/animacraft_v8_${package}" \
              --force \
              --disassemble \
              --warnings-are-errors
          done
          npm run move:size

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify required files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f GOVERNANCE.md
          test -f CONTRIBUTING.md
          test -f index.html
          test -f app.js
          test -f maker-v8-runtime.js
          test -f maker-v8-compiler.js
          test -f maker-v8-market.js
          test -f maker-v8-recovery.js
          test -f maker-v8-browser.js
          test -f test/maker-v8-runtime.test.js
          test -f test/maker-v8-compiler.test.js
          test -f test/maker-v8-market.test.js
          test -f test/maker-v8-recovery.test.js
          test -f test/maker-v8-browser.test.js
          test -f styles.css
          for package in core seal runtime output physical market release; do
            test -f "move/animacraft_v8_${package}/Move.toml"
          done
          test -f test/harness/animacraft_v8_seal_cap_harness/Move.toml
          test -f test/harness/animacraft_v8_seal_cap_harness/README.md

      - name: Verify fresh-only delivery surface
        run: npm run scan:fresh:source

      - name: Prevent generated build artifacts
        run: |
          if git ls-files | grep -E '(^|/)build/'; then
            echo "Generated build artifacts must not be committed."
            exit 1
          fi

      - name: Check for obvious secret names
        run: |
          if git grep -nE '(PRIVATE_KEY|SECRET_KEY|ACCESS_TOKEN|GITHUB_TOKEN|MNEMONIC=)' -- . ':!.github/workflows/repository-hygiene.yml'; then
            echo "Potential secret-like text found. Please remove or document why it is safe."
            exit 1
          fi
